name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test --if-present

      - name: Build
        # GEMINI_API_KEY はビルド時には不要だがランタイムで参照する。
        # Vercel 本番デプロイ側で環境変数を入れているので、CI では空でも通る。
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'dummy-for-ci' }}
        run: npx next build
